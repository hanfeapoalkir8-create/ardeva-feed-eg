<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10261E">
<title>أردِيفا للخدمات الزراعية | Ardeva & محاكي مصانع الأعلاف الثلاثي الأبعاد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4EF; --surface:#FFFFFF; --surface2:#E8ECE5; --ink:#12231B; --muted:#56665D; --line:#D5DCD2;
  --band:#10261E; --band-ink:#EAF1EC; --band-muted:#A9BCB1; --band-line:#2A4538; --band-up:#5BD08E; --band-down:#FF8A78;
  --brand:#1F6A4A; --accent:#E0A936; --accent-ink:#1A1405; --up:#1E7D47; --down:#C13B2B; --focus:#1F6A4A;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1510; --surface:#13221A; --surface2:#1B2E24; --ink:#E5EEE8; --muted:#9DB0A5; --line:#243A2E;
    --band:#08110C; --band-ink:#EAF1EC; --band-muted:#9CB0A4; --band-line:#1F3328; --band-up:#5BD08E; --band-down:#FF8A78;
    --brand:#58C08D; --accent:#E8B84A; --accent-ink:#1A1405; --up:#4CC27F; --down:#F0705E; --focus:#58C08D;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.25;font-weight:600}
p{margin:0}
.wrap{max-width:1220px;margin-inline:auto;padding-left:16px;padding-right:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hdr{position:sticky;top:0;z-index:30;background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-line)}
.hdr-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;min-width:0}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px}
.logo{height:34px;width:auto;max-width:120px;object-fit:contain;display:block;border-radius:6px}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.nav button{background:none;border:0;color:var(--band-muted);padding:7px 11px;border-radius:8px;white-space:nowrap;font-size:14px;font-weight:500}
.nav button:hover{color:var(--band-ink);background:rgba(255,255,255,.05)}
.nav button.sim-highlight{color:var(--accent);font-weight:700;border:1px solid rgba(224,169,54,.35)}
.hdr-act{display:flex;gap:8px;margin-inline-start:auto;align-items:center;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--band-line);color:var(--band-ink);padding:6px 13px;border-radius:999px;font-size:13px}
.chip:hover{border-color:var(--band-muted)}
.chip-solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip-danger{background:rgba(240,112,94,.18);color:#ffb4a8;border-color:rgba(240,112,94,.4)}

/* Social Links Pills */
.soc-bar{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.soc-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface2);color:var(--ink);transition:transform .15s}
.soc-pill:hover{transform:translateY(-1px)}
.band .soc-pill{background:rgba(255,255,255,.08);color:var(--band-ink);border-color:var(--band-line)}
.soc-fb{color:#1877F2!important}
.soc-yt{color:#FF0000!important}
.soc-tt{color:#00f2fe!important}
.surface-tt{color:#111!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid transparent;font-weight:600;text-decoration:none;line-height:1.3;text-align:center;transition:filter .15s}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-brand{background:var(--brand);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--muted)}
.band .btn-ghost{border-color:var(--band-line);color:var(--band-ink)}
.btn-sm{padding:6px 12px;font-size:13px}
.danger{color:var(--down)}

.band{background:var(--band);color:var(--band-ink)}
.hero{background-size:cover;background-position:center}
.hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;padding-block:48px;align-items:start}
.eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;color:var(--accent);margin-bottom:12px;font-weight:600}
.hero h1{font-size:clamp(26px,4.2vw,44px);line-height:1.2;margin-bottom:16px}
.hero .lead{color:var(--band-muted);font-size:17px;max-width:36em;margin-bottom:24px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.board{border:1px solid var(--band-line);background:rgba(255,255,255,.04);border-radius:14px;padding:18px;min-width:0}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.board-head h2{font-size:18px}
.board-head .mono{font-size:12px;color:var(--band-muted)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto 74px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--band-line)}
.brow .nm b{display:block;font-weight:500}
.brow .nm small{color:var(--band-muted);font-size:12px}
.brow .pr{font-family:var(--font-mono);text-align:end;white-space:nowrap}
.pill{font-family:var(--font-mono);font-size:12px;padding:3px 8px;border-radius:999px;text-align:center;background:color-mix(in srgb,currentColor 15%,transparent);white-space:nowrap}
.band .up{color:var(--band-up)}.band .down{color:var(--band-down)}
.up{color:var(--up)}.down{color:var(--down)}
.spark{display:block}
.board .note{color:var(--band-muted);font-size:13px;margin:12px 0 14px}

.sec{padding-block:54px}
.sec h2{font-size:clamp(22px,3vw,30px);margin-bottom:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;color:var(--muted);white-space:nowrap;font-weight:600;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.imgbox{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface2);overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:cover;display:block}
.phsvg{position:absolute;inset:0;width:100%;height:100%}
.phsvg path{fill:none;stroke:var(--brand);stroke-opacity:.3;stroke-width:1.4}
.imgcap{position:absolute;inset-inline-start:10px;bottom:8px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.pbody{padding:15px;display:flex;flex-direction:column;gap:10px;flex:1}
.pbody h3{font-size:17px}
.seller{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--brand)}
.price{font-family:var(--font-mono);font-size:18px;font-weight:600;margin-top:auto;padding-top:4px}
.price small{color:var(--muted);font-weight:400;font-size:13px}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.pact .btn{flex:1 1 105px}
.empty{padding:32px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* Simulator Styles */
.sim-sec{background:linear-gradient(180deg, #0d1f18 0%, #091410 100%);color:#EAF1EC;padding-block:56px;border-block:3px solid var(--accent)}
.sim-header-box{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--band-line)}
.sim-nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:6px}
.sim-nav button{background:rgba(255,255,255,.06);border:1px solid var(--band-line);color:var(--band-muted);padding:11px 18px;border-radius:10px;font-weight:600;white-space:nowrap}
.sim-nav button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sim-card{background:rgba(255,255,255,.04);border:1px solid var(--band-line);border-radius:14px;padding:20px;margin-bottom:18px}
.sim-grid-2{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px}
.sim-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.sim-slot{background:rgba(0,0,0,.35);border:2px dashed var(--band-line);border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;min-height:220px;position:relative}
.sim-slot.filled{border-style:solid;border-color:var(--band-up);background:rgba(91,208,142,.08)}
.sim-step-badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);width:24px;height:24px;border-radius:50%;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.eq-item{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.3);border:1px solid var(--band-line);border-radius:10px;padding:10px;margin-bottom:10px}
.eq-thumb{width:68px;height:68px;border-radius:8px;background:#10261E;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid var(--band-line)}
.eq-thumb img{width:100%;height:100%;object-fit:cover}

/* 3D & Schematic Diagram Container */
.schematic-box{background:linear-gradient(180deg,#f8fafc 0%,#e2e8f0 100%);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:16px;color:#0f172a;position:relative;overflow:hidden}
.schematic-title{text-align:center;font-family:var(--font-display);font-size:clamp(18px,2.5vw,26px);font-weight:700;color:#334155;margin-bottom:8px}
.schematic-svg{width:100%;height:auto;max-height:420px;display:block;margin:0 auto}
.schematic-banner{background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 18px;text-align:center;font-weight:700;font-size:14px;color:#0f172a;max-width:620px;margin:8px auto 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.canvas-3d-box{width:100%;height:340px;background:#07110c;border:1px solid var(--band-line);border-radius:12px;overflow:hidden;position:relative;margin-bottom:14px;cursor:grab}
.canvas-3d-box:active{cursor:grabbing}
.view-toggle-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* Raw Material Realistic Textures */
.raw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:460px;overflow-y:auto}
.raw-card{background:rgba(0,0,0,.35);border:1px solid var(--band-line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:transform .15s}
.raw-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.raw-tex{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(255,255,255,.25);box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.tex-corn{background:radial-gradient(circle,#fde047 20%,#eab308 65%,#ca8a04 100%)}
.tex-soy{background:radial-gradient(circle,#fef08a 15%,#d6d3d1 55%,#a8a29e 95%)}
.tex-gluten{background:linear-gradient(135deg,#f59e0b 0%,#d97706 55%,#b45309 100%)}
.tex-sunflower{background:radial-gradient(circle,#57534e 20%,#292524 75%,#1c1917 100%)}
.tex-bran{background:repeating-linear-gradient(45deg,#b45309,#b45309 3px,#d97706 3px,#d97706 6px)}
.tex-barley{background:radial-gradient(circle,#f5f5f4 30%,#d6d3d1 70%,#a8a29e 100%)}
.tex-beet{background:radial-gradient(circle,#78716c 20%,#44403c 85%)}
.tex-date{background:radial-gradient(circle,#9a3412 20%,#7c2d12 75%,#431407 100%)}
.tex-molasses{background:radial-gradient(circle at 30% 30%,#451a03,#1c0a00 70%,#000 100%)}
.tex-oil{background:linear-gradient(180deg,#fef08a 0%,#facc15 100%)}
.tex-lime{background:#f8fafc}
.tex-premix{background:linear-gradient(45deg,#22c55e,#3b82f6,#eab308)}

.sim-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.sim-table th,.sim-table td{padding:9px;border-bottom:1px solid var(--band-line);text-align:right}
.sim-table th{color:var(--accent);background:rgba(0,0,0,.25)}
.sim-inp{background:#08110C;border:1px solid var(--band-line);color:#fff;padding:8px 10px;border-radius:8px;width:100%}
.pipe-anim{height:8px;background:var(--band-line);border-radius:4px;margin-top:14px;overflow:hidden;position:relative}
.pipe-anim.run::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 14px,var(--accent) 14px,var(--accent) 28px);animation:flowMove 1s linear infinite}
@keyframes flowMove{from{background-position:56px 0}to{background-position:0 0}}
.running .spin-part{animation:spin360 1.4s linear infinite;transform-origin:center}
@keyframes spin360{100%{transform:rotate(360deg)}}

.alt{background:var(--surface2)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.steps li{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:2px solid var(--brand)}
.steps .n{font-family:var(--font-mono);font-size:13px;color:var(--brand)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
.plan.feat{border-color:var(--brand);border-width:2px}
.plan .amt{font-family:var(--font-mono);font-size:28px;font-weight:600}
.plan .amt small{font-size:14px;color:var(--muted);font-weight:400}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.plan li::before{content:"✓";margin-inline-end:8px;color:var(--brand);font-weight:700}
.foot{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
.foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}

/* Admin Panel & Master Save Button */
.login-wrap{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:16px}
.admin{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-block:32px 72px;align-items:start}
.anav{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px}
.anav button{background:none;border:0;text-align:start;padding:11px 14px;border-radius:8px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.anav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.anav .count{font-family:var(--font-mono);font-size:12px;background:var(--surface2);padding:1px 7px;border-radius:99px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.save-badge{font-size:13px;color:var(--up);display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--up) 12%,transparent);padding:4px 12px;border-radius:999px;font-weight:600}
.save-badge.unsaved{color:var(--accent-ink);background:var(--accent)}
.master-save-bar{position:sticky;bottom:14px;z-index:25;background:var(--band);color:var(--band-ink);padding:14px 20px;border-radius:14px;border:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-top:10px}
.btn-save-master{background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;padding:12px 28px;border-radius:10px;border:0;box-shadow:0 4px 14px rgba(224,169,54,.4);transition:transform .15s,filter .15s}
.btn-save-master:hover{filter:brightness(1.08);transform:translateY(-1px)}
.hint{color:var(--muted);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.prow{display:grid;grid-template-columns:145px minmax(0,1fr) auto;gap:16px;align-items:start;padding-top:16px;border-top:1px solid var(--line)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.imgctl{display:flex;flex-direction:column;gap:8px}
.imgctl .imgbox{border-radius:8px;border:1px solid var(--line)}
.imgctl.wide{max-width:300px}
.imgbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) auto;gap:12px;align-items:end;padding-top:14px;border-top:1px solid var(--line)}
.seller-admin-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.subsec-title{font-size:16px;font-weight:700;padding-top:12px;border-top:1px solid var(--line);color:var(--brand)}

/* Chat & Toast */
.fab{position:fixed;inset-inline-end:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cpanel{position:fixed;inset-inline-end:16px;bottom:16px;z-index:40;width:min(360px,calc(100vw - 32px));height:min(440px,70vh);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.28)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--band);color:var(--band-ink)}
.chead .x{background:none;border:0;color:inherit;font-size:24px;line-height:1;padding:0 6px}
.cmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:14px}
.msg.s{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.cform input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:60;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media (max-width:950px){
  .hero-in,.sim-grid-2{grid-template-columns:minmax(0,1fr)}
}

function readImg(file,max,mime,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,max/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL(mime,0.82));
    };
    im.onerror=function(){toast(tr('imgFail'));};
    im.src=fr.result;
  };
  fr.onerror=function(){toast(tr('imgFail'));};
  fr.readAsDataURL(file);
}
function ph(seed){
  var s=0,str=String(seed),p='',i,x;
  for(i=0;i<str.length;i++){s=(s*31+str.charCodeAt(i))%997;}
  for(i=0;i<9;i++){
    var y=30+i*26,a=10+((s+i*7)%14),f=((s+i*13)%628)/100,d='M0 '+y;
    for(x=0;x<=400;x+=20){d+=' L'+x+' '+(y+Math.sin(x/60+f+i*0.5)*a).toFixed(1);}
    p+='<path fill="none" d="'+d+'"/>';
  }
  return '<svg class="phsvg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+p+'</svg>';
}
function imgBox(src,seed,cap){
  return '<div class="imgbox">'+(src?'<img src="'+esc(src)+'" alt="">':ph(seed)+(cap?'<span class="imgcap">'+esc(tr('photoHint'))+'</span>':''))+'</div>';
}

function series(i,base){
  var h=Math.floor(Date.now()/3.6e6),out=[],k;
  for(k=11;k>=0;k--){var t=h-k;out.push(Math.round(base*(1+0.018*Math.sin(t*0.9+i*1.7)+0.009*Math.sin(t*2.3+i*0.6))/10)*10);}
  out[out.length-1]=Number(base)||0;
  return out;
}
function spark(v){
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),w=72,h=24,rng=(mx-mn)||1;
  var pts=v.map(function(y,i){return [(i/(v.length-1)*(w-4)+2).toFixed(1),(h-3-((y-mn)/rng)*(h-6)).toFixed(1)];});
  var last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 72 24" width="72" height="24" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p.join(',');}).join(' ')+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.4" fill="currentColor"/></svg>';
}

/* Three.js 3D Factory Simulation matching the exact 5-stage schematic */
var threeScene=null, threeRenderer=null, threeAnimId=null, threeMeshes=[];
function init3DCanvas(containerId){
  var container = document.getElementById(containerId);
  if(!container || typeof THREE === 'undefined') return;
  if(threeAnimId) cancelAnimationFrame(threeAnimId);
  container.innerHTML = '';

  var width = container.clientWidth || 700;
  var height = container.clientHeight || 340;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1510);

  var camera = new THREE.PerspectiveCamera(42, width/height, 0.1, 1000);
  var camAngle = 0, camHeight = 7.5, camRadius = 22;
  function updateCam(){
    camera.position.x = Math.sin(camAngle) * camRadius;
    camera.position.z = Math.cos(camAngle) * camRadius;
    camera.position.y = camHeight;
    camera.lookAt(0, 3.2, 0);
  }
  updateCam();

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  /* Mouse & Touch Orbit Controls */
  var isDragging = false, prevX = 0, prevY = 0;
  container.onmousedown = function(ev){ isDragging=true; prevX=ev.clientX; prevY=ev.clientY; };
  window.addEventListener('mouseup', function(){ isDragging=false; });
  container.onmousemove = function(ev){
    if(!isDragging) return;
    camAngle -= (ev.clientX - prevX) * 0.008;
    camHeight = Math.max(2, Math.min(16, camHeight + (ev.clientY - prevY) * 0.03));
    prevX = ev.clientX; prevY = ev.clientY;
    updateCam();
  };

  /* Lighting */
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var dirLight = new THREE.DirectionalLight(0xfff4d6, 1.1);
  dirLight.position.set(12, 24, 16);
  scene.add(dirLight);

  /* Factory Floor */
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 12),
    new THREE.MeshStandardMaterial({color: 0x162920, roughness: 0.85})
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  var matGreen = new THREE.MeshStandardMaterial({color: 0x3b7a4c, metalness: 0.3});
  var matBlue  = new THREE.MeshStandardMaterial({color: 0x3b6e8c, metalness: 0.4, roughness: 0.4});
  var matYellow= new THREE.MeshStandardMaterial({color: 0xeab308, metalness: 0.3});
  var matWhite = new THREE.MeshStandardMaterial({color: 0xf1f5f9, metalness: 0.2});
  var matSteel = new THREE.MeshStandardMaterial({color: 0x64748b, metalness: 0.6});

  threeMeshes = [];

  function addElevator(parent, x, h){
    var leg = new THREE.Mesh(new THREE.BoxGeometry(0.38, h, 0.38), matGreen);
    leg.position.set(x, h/2, 0);
    parent.add(leg);
    var head = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.5, 0.5), matGreen);
    head.position.set(x, h + 0.2, 0);
    parent.add(head);
  }

  /* Stage 1 (Right: x = +8): Elevator 1 + Yellow Crusher Tank + White Hammer Mill + Tall Elevator 2 */
  if(U.selectedLine[1]){
    var g1 = new THREE.Group();
    addElevator(g1, 9.2, 5.2);
    var yTank = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.4), matYellow);
    yTank.position.set(7.8, 3.8, 0);
    g1.add(yTank);
    var mill = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), matWhite);
    mill.position.set(7.5, 1.2, 0);
    g1.add(mill);
    addElevator(g1, 6.2, 7.6);
    scene.add(g1);
    threeMeshes.push(mill);
  }

  /* Stage 2 (Middle-Right: x = +3.2): 4 Blue Batching Silos + Scale Hopper */
  if(U.selectedLine[2]){
    var g2 = new THREE.Group();
    for(var b=0; b<4; b++){
      var bx = 2.0 + b*0.95;
      var cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 2.5, 20), matBlue);
      cyl.position.set(bx, 5.0, 0);
      g2.add(cyl);
      var cone = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.8, 20), matBlue);
      cone.rotation.x = Math.PI;
      cone.position.set(bx, 3.35, 0);
      g2.add(cone);
    }
    var scaleBox = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.2, 4), matBlue);
    scaleBox.rotation.x = Math.PI;
    scaleBox.rotation.y = Math.PI/4;
    scaleBox.position.set(3.4, 1.8, 0);
    g2.add(scaleBox);
    scene.add(g2);
    threeMeshes.push(scaleBox);
  }

  /* Stage 3 (Center: x = -0.8): Elevator 3 + White Horizontal Mixer + Hoppers */
  if(U.selectedLine[3] || U.selectedLine[2]){
    var g3 = new THREE.Group();
    addElevator(g3, 0.6, 6.0);
    var hMixer = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 1.9, 20), matWhite);
    hMixer.rotation.z = Math.PI / 2;
    hMixer.position.set(-0.9, 3.2, 0);
    g3.add(hMixer);
    var topHopper = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.9, 4), matBlue);
    topHopper.rotation.x = Math.PI;
    topHopper.rotation.y = Math.PI/4;
    topHopper.position.set(-0.9, 4.3, 0);
    g3.add(topHopper);
    scene.add(g3);
    threeMeshes.push(hMixer);
  }

  /* Stage 4 (Middle-Left: x = -4.2): Elevator 4 + Pellet Tank + Pellet Mill + Yellow Cooler */
  if(U.selectedLine[3] || U.selectedLine[4]){
    var g4 = new THREE.Group();
    addElevator(g4, -2.6, 6.6);
    var pTank = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.2, 1.5, 16), matBlue);
    pTank.position.set(-4.2, 5.2, 0);
    g4.add(pTank);
    var pMill = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 1.1), matBlue);
    pMill.position.set(-4.2, 3.5, 0);
    g4.add(pMill);
    var yCooler = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.3, 1.1), matYellow);
    yCooler.position.set(-4.2, 1.8, 0);
    g4.add(yCooler);
    scene.add(g4);
    threeMeshes.push(pMill);
  }

  /* Stage 5 (Leftmost: x = -7.8): Elevator 5 + Green Sifter + Final Blue Silo + Packing */
  if(U.selectedLine[5]){
    var g5 = new THREE.Group();
    addElevator(g5, -5.8, 6.5);
    var sifter = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.65, 1.1), matGreen);
    sifter.position.set(-7.8, 5.4, 0);
    g5.add(sifter);
    var fTank = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 1.5), matBlue);
    fTank.position.set(-7.8, 3.6, 0);
    g5.add(fTank);
    var fPack = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.9), matYellow);
    fPack.position.set(-7.8, 1.0, 0);
    g5.add(fPack);
    scene.add(g5);
    threeMeshes.push(sifter);
  }

  function animate3D(){
    threeAnimId = requestAnimationFrame(animate3D);
    if(U.simRunning){
      threeMeshes.forEach(function(m, idx){
        m.position.y += Math.sin(Date.now()*0.01 + idx)*0.003;
      });
    }
    renderer.render(scene, camera);
  }
  animate3D();
}

  var caps=[];
  for(var i=1;i<=4;i++){if(U.selectedLine[i]){caps.push(Number(U.selectedLine[i].cap));}}
  return caps.length>=3?Math.min.apply(null,caps):0;
}
function getSimEquipCost(){
  var c=0;
  for(var i=1;i<=5;i++){if(U.selectedLine[i]){c+=Number(U.selectedLine[i].price);}}
  return c;
}
function getSimEquipKw(){
  var kw=0;
  for(var i=1;i<=5;i++){if(U.selectedLine[i]){kw+=Number(U.selectedLine[i].kw);}}
  return kw;
}
function getSimRawTonCost(){
  var cost=0;
  Object.keys(U.formulaMix).forEach(function(k){
    var r=S.rawMaterials[k];
    if(r){cost+=(Number(U.formulaMix[k])/1000)*Number(r.price);}
  });
  return Math.round(cost);

function simFormulaLabHTML(){
  var rawCards=Object.keys(S.rawMaterials).map(function(k){
    var r=S.rawMaterials[k];
    return '<div class="raw-card" data-sim="addRaw" data-k="'+k+'">'+
      '<div class="raw-tex '+r.tex+'"></div>'+
      '<div style="font-weight:700;font-size:12px">'+esc(r.name)+'</div>'+
      '<div style="font-size:11px;color:var(--accent)">'+fmt(r.price)+' ج.م/طن</div>'+
      '<div style="font-size:10px;color:var(--band-muted)">بروتين '+r.protein+'%</div></div>';
  }).join('');

  var catOpts='<option value="poultry"'+(U.formulaCat==='poultry'?' selected':'')+'>🐔 أعلاف الدواجن (10 تركيبات اقتصادية)</option>'+
              '<option value="cattle"'+(U.formulaCat==='cattle'?' selected':'')+'>🐄 أعلاف المواشي والأبقار (10 تركيبات)</option>'+
              '<option value="sheep"'+(U.formulaCat==='sheep'?' selected':'')+'>🐑 أعلاف الأغنام والماعز (10 تركيبات)</option>';

  var recOpts=FORMULAS_DB[U.formulaCat].map(function(f,i){
    return '<option value="'+i+'"'+(Number(U.formulaIdx)===i?' selected':'')+'>'+esc(f.name)+'</option>';
  }).join('');

  var totalW=0,totalCost=0,totalProt=0,totalEnergy=0;
  var rowsHTML=Object.keys(U.formulaMix).map(function(k){
    var qty=Number(U.formulaMix[k])||0;
    var r=S.rawMaterials[k];
    if(!r||qty<=0){return '';}
    totalW+=qty;
    var c=(qty/1000)*Number(r.price);
    totalCost+=c;
    totalProt+=(qty*Number(r.protein))/100;
    totalEnergy+=(qty/1000)*Number(r.energy);
    return '<tr>'+
      '<td><span class="raw-tex '+r.tex+'" style="width:20px;height:20px;display:inline-block;vertical-align:middle;margin:0 0 0 6px"></span>'+esc(r.name)+'</td>'+
      '<td>'+fmt(r.price)+' ج.م</td>'+
      '<td><input type="number" class="sim-inp" style="width:85px;padding:4px 6px;text-align:center" value="'+qty+'" step="5" data-sim-qty="'+k+'"></td>'+
      '<td>'+((qty/1000)*100).toFixed(1)+'%</td>'+
      '<td style="color:var(--accent);font-weight:700">'+fmt(Math.round(c))+' ج.م</td></tr>';
  }).join('');

  var protPct=totalW>0?((totalProt/totalW)*100).toFixed(1):0;

  return '<div class="sim-grid-2">'+
    '<div class="sim-card"><h3 style="margin-bottom:8px;color:var(--accent)">🌾 مخزن الخامات الحقيقية (اضغط للإضافة)</h3>'+
      '<div class="raw-grid">'+rawCards+'</div></div>'+
    '<div class="sim-card">'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px">'+
        '<label class="fld"><span>1. اختر فئة العلف:</span><select class="sim-inp" data-sim-inp="formulaCat">'+catOpts+'</select></label>'+
        '<label class="fld"><span>2. اختر من الـ 30 تركيبة الجاهزة:</span><select class="sim-inp" data-sim-inp="formulaIdx">'+recOpts+'</select></label>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;background:rgba(0,0,0,.4);padding:12px;border-radius:10px;margin-bottom:12px">'+
        '<div><small style="color:var(--band-muted);display:block;font-size:11px">إجمالي الوزن</small><b style="color:'+(totalW===1000?'#5BD08E':'#E0A936')+'">'+totalW+' كجم</b></div>'+
        '<div><small style="color:var(--band-muted);display:block;font-size:11px">البروتين الخام</small><b>'+protPct+' %</b></div>'+
        '<div><small style="color:var(--band-muted);display:block;font-size:11px">الطاقة الممثلة</small><b>'+Math.round(totalEnergy)+' Kcal</b></div>'+
        '<div><small style="color:var(--band-muted);display:block;font-size:11px">تكلفة الطن (خامات)</small><b style="color:#5BD08E">'+fmt(Math.round(totalCost))+' ج.م</b></div>'+
      '</div>'+
      '<div style="max-height:320px;overflow-y:auto"><table class="sim-table"><thead><tr><th>الخامة</th><th>سعر الطن</th><th>الكمية (كجم)</th><th>النسبة</th><th>التكلفة</th></tr></thead><tbody>'+rowsHTML+'</tbody></table></div>'+
      '<div style="margin-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">'+
        '<button class="btn btn-ghost btn-sm" data-sim="balance1000">⚖️ موازنة تلقائية إلى 1000 كجم</button>'+
        '<button class="btn btn-accent" data-sim="tab" data-v="roi">تشغيل المصنع وحساب الأرباح ⬅️</button>'+
      '</div></div></div>';
}

app.addEventListener('click',function(e){
  var simBtn=e.target.closest('[data-sim]');
  if(simBtn){
    var act=simBtn.dataset.sim;
    if(act==='tab'){U.simTab=simBtn.dataset.v;render();}
    else if(act==='vmode'){U.visualMode=simBtn.dataset.v;render();}
    else if(act==='filterEq'){U.eqFilter=simBtn.dataset.v;render();}
    else if(act==='installEq'){
      var eq=S.simEquipment.find(function(x){return x.id===simBtn.dataset.id;});
      if(eq){U.selectedLine[eq.step]=eq;render();}
    }
    else if(act==='removeEq'){U.selectedLine[simBtn.dataset.step]=null;render();}
    else if(act==='addRaw'){
      var k=simBtn.dataset.k;
      U.formulaMix[k]=(Number(U.formulaMix[k])||0)+25;
      render();
    }
    else if(act==='balance1000'){
      var tot=0;
      Object.values(U.formulaMix).forEach(function(v){tot+=Number(v)||0;});
      if(tot>0){
        var diff=1000-tot;
        U.formulaMix.corn=Math.max(0,(Number(U.formulaMix.corn)||0)+diff);
        render();
      }
    }
    else if(act==='toggleRun'){U.simRunning=!U.simRunning;render();}
    else if(act==='orderWa'){
      var lines=[];
      for(var s=1;s<=5;s++){if(U.selectedLine[s]){lines.push('- '+U.selectedLine[s].name);}}
      var msg='مرحباً فريق '+(S.siteNameAr||S.siteName)+',\nقمت بتصميم مصنعي ('+U.factoryName+') عبر محاكي مصانع الأعلاف الثلاثي الأبعاد:\n'+lines.join('\n')+'\nالقدرة: '+getSimLineCap()+' طن/ساعة\nالتركيبة: '+U.formulaTitle;
      var phNum=String(S.whatsapp||'201000000000').replace(/\D/g,'');
      window.open('https://wa.me/'+phNum+'?text='+encodeURIComponent(msg),'_blank');
    }
    return;
  }

  var el=e.target.closest('[data-a]');if(!el){return;}
  var a=el.dataset.a,i=parseInt(el.dataset.i,10),id=el.dataset.id;
  if(a!=='reset'&&U.resetAsk){U.resetAsk=false;}
  if(a==='home'){goHome();}
  else if(a==='admin'){
    if(U.view!=='admin'){D=clone(S);U.dirty=false;}
    U.view=U.view==='admin'?'home':'admin';
    render();window.scrollTo(0,0);
  }
  else if(a==='masterSave'){
    saveAllAdminChanges();
  }
  else if(a==='logout'){
    U.unlocked=false;
    sessionStorage.removeItem(AUTH_KEY);
    goHome();
  }
  else if(a==='exportJSON'){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var link=document.createElement('a');
    link.href=url;
    link.download=(S.siteName||'ardeva')+'-3d-backup.json';
    link.click();
    URL.revokeObjectURL(url);
  }
  else if(a==='lang'){S.lang=S.lang==='ar'?'en':'ar';D.lang=S.lang;save();render();}
  else if(a==='scroll'){var go=function(){var t=document.getElementById(id);if(t){t.scrollIntoView({behavior:'smooth',block:'start'});}};if(U.view!=='home'){goHome(function(){setTimeout(go,30);});}else{go();}}
  else if(a==='tab'){U.sel=id;render();}
  else if(a==='buy'){toast(tr('payDemo'));}
  else if(a==='chat'){if(U.chat.withId!==id||!U.msgs.length){seedMsgs();}U.chat={open:true,withId:id};renderChat();}
  else if(a==='waSetup'){toast(tr('waNeed'));D=clone(S);U.dirty=false;U.view='admin';U.atab='site';render();window.scrollTo(0,0);}
  else if(a==='atab'){U.atab=id;render();}
  else if(a==='rmImg'){setPath(D,el.dataset.p,null);markDirty();render();}
  else if(a==='addSec'){D.sections.push({id:uid(),ar:'قسم جديد',en:'New section'});markDirty();render();}
  else if(a==='delSec'){
    var sid=D.sections[i].id;
    if(D.sections.length<2){toast(tr('lastSec'));}
    else if(D.products.some(function(p){return p.sec===sid;})||D.board.some(function(b){return b.sec===sid;})){toast(tr('secBusy'));}
    else{D.sections.splice(i,1);markDirty();render();}
  }
  else if(a==='addProd'){
    var defaultSeller=(D.sellers[0]&&D.sellers[0].name)||'';
    D.products.push({id:uid(),sec:D.sections[0].id,ar:'منتج جديد',en:'New product',seller:defaultSeller,price:1000,img:null});
    markDirty();render();
  }
  else if(a==='delProd'){D.products.splice(i,1);markDirty();render();}
  else if(a==='addPrice'){D.board.push({id:uid(),sec:D.sections[0].id,ar:'صنف جديد',en:'New item',base:10000});markDirty();render();}
  else if(a==='delPrice'){D.board.splice(i,1);markDirty();render();}
  else if(a==='addSeller'){D.sellers.push({id:uid(),name:'شركة جديدة',plan:'yearly',start:new Date().toISOString().slice(0,10),fb:'',yt:'',tt:'',web:''});markDirty();render();}
  else if(a==='delSeller'){D.sellers.splice(i,1);markDirty();render();}
  else if(a==='reset'){
    if(!U.resetAsk){U.resetAsk=true;render();}
    else{
      var keepPass=S.adminPass;
      try{localStorage.removeItem(LS);}catch(x){}
      S=clone(DEF);
      S.adminPass=keepPass;
      D=clone(S);
      U.dirty=false;
      save();
      U.resetAsk=false;U.sel=null;render();toast('✓');
    }
  }
});

app.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.simQty){
    var k=el.dataset.simQty;
    var val=Math.max(0,parseFloat(el.value)||0);
    if(val===0){delete U.formulaMix[k];}else{U.formulaMix[k]=val;}
    render();
    return;
  }
  if(el.dataset.simInp && el.tagName!=='SELECT'){
    var prop=el.dataset.simInp;
    U[prop]=el.type==='number'?(parseFloat(el.value)||0):el.value;
    render();
    return;
  }
  var p=el.dataset.p;
  if(!p || el.type==='file' || el.tagName==='SELECT' || el.type==='date'){return;}
  var v=el.value;
  if(el.dataset.t==='num'){v=Math.max(0,parseFloat(v)||0);}
  setPath(D,p,v);
  markDirty();
});

app.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.simInp && el.tagName==='SELECT'){
    var sp=el.dataset.simInp;
    if(sp==='budgetTier'){U.budgetTier=Number(el.value);}
    else if(sp==='formulaCat'){loadSimFormula(el.value,0);}
    else if(sp==='formulaIdx'){loadSimFormula(U.formulaCat,Number(el.value));}
    render();
    return;
  }
  if(el.id==='importJsonInput'){
    var f=el.files&&el.files[0];if(!f){return;}
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var imported=JSON.parse(fr.result);
        D=Object.assign(clone(DEF),imported);
        saveAllAdminChanges();
        toast(tr('importOk'));
      }catch(err){toast('ملف غير صالح');}
    };
    fr.readAsText(f);
    return;
  }
  var p=el.dataset.p;if(!p){return;}
  if(el.type==='file'){
    var file=el.files&&el.files[0];if(!file){return;}
    readImg(file,parseInt(el.dataset.max,10)||1200,el.dataset.mime||'image/jpeg',function(url){setPath(D,p,url);markDirty();render();});
    return;
  }
  var v=el.value;
  if(el.dataset.t==='num'){v=Math.max(0,parseFloat(v)||0);}
  setPath(D,p,v);
  markDirty();
  if(el.dataset.r){render();}
});

var chatBox=document.getElementById('chat');
chatBox.addEventListener('click',function(e){
  var el=e.target.closest('[data-c]');if(!el){return;}
  if(el.dataset.c==='open'){U.chat.open=true;if(!U.msgs.length){seedMsgs();}renderChat();}
  else if(el.dataset.c==='close'){U.chat.open=false;renderChat();}
  else if(el.dataset.c==='send'){sendMsg();}
});
function addMsg(m){
  U.msgs.push(m);
  var l=document.getElementById('cmsgs');if(!l){return;}
  var d=document.createElement('div');d.className='msg '+(m.from==='me'?'me':'s');d.textContent=m.key?tr(m.key):m.txt;
  l.appendChild(d);l.scrollTop=l.scrollHeight;
}
function botKey(t){
  t=t.toLowerCase();
  if(/سعر|بكام|كام|price|cost/.test(t)){return 'r_price';}
  if(/توصيل|تسليم|شحن|تركيب|ship/.test(t)){return 'r_ship';}
  if(/متاح|موجود|stock/.test(t)){return 'r_stock';}
  if(/ضمان|دفع|escrow|pay/.test(t)){return 'r_pay';}
  return 'chatReply';
}
function sendMsg(){
  var inp=document.getElementById('cin');if(!inp){return;}
  var v=inp.value.trim();if(!v){return;}
  inp.value='';addMsg({from:'me',txt:v});inp.focus();
  var k=botKey(v);
  setTimeout(function(){if(U.chat.open){addMsg({from:'s',key:k});}else{U.msgs.push({from:'s',key:k});}},650);
}
chatBox.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='cin'&&!e.isComposing){e.preventDefault();sendMsg();}
});

render();
})();
</script>
</body>
</html>
